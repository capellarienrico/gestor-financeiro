name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../GestorFinanceiro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Financeiro-APK
          path: GestorFinanceiro.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Gestor Financeiro v1.0.0
          body: "### 📱 Gestor Financeiro - Android APK\n\nBaixe o arquivo **GestorFinanceiro.apk** abaixo e instale no seu celular Android.\n\n- Projeção de gastos e saldo cumulativo\n- Lançamentos diários e recorrentes\n- Simulador de teto diário\n- Importação de extrato Nubank"
          files: GestorFinanceiro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
