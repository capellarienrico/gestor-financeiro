name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../GestorFinanceiro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Financeiro-APK
          path: GestorFinanceiro.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Gestor Financeiro ${{ steps.release_tag.outputs.tag }}
          body: "### 📱 Gestor Financeiro - Android APK\n\nBaixe o arquivo **GestorFinanceiro.apk** abaixo e instale no seu celular Android.\n\nConsulte o arquivo [RELEASES.md](RELEASES.md) para a lista de novidades desta versão."
          files: GestorFinanceiro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
